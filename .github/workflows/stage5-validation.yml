name: Stage 5 validation

on:
  pull_request:
    paths:
      - "apps-script/**"
      - "docs/digital/**"
      - "README.md"
      - "scripts/validate_stage4.py"
      - "scripts/package_apps_script.py"
      - "scripts/test_package_apps_script.py"
      - ".github/workflows/stage5-validation.yml"
  push:
    branches:
      - stage-5-working-mvp
      - stage-5-2-authenticated-sheets-backend
      - stage-5-3-secure-recoverable-service
      - stage-5-4-google-integration-packaging
      - stage-5-10-whatsapp-durable-boundary
      - stage-5-11-durable-sheets-recovery

jobs:
  pure-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Apps Script-compatible tests
        run: node --test apps-script/tests/*.test.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test Apps Script package gate
        run: python -m unittest scripts.test_package_apps_script
      - name: Build deterministic Apps Script package
        run: python scripts/package_apps_script.py
      - name: Validate generated package contents
        run: |
          test -s dist/apps-script/Code.gs
          test -s dist/apps-script/appsscript.json
          test "$(find dist/apps-script -maxdepth 1 -type f | wc -l)" -eq 2
          node --check < dist/apps-script/Code.gs
          ! grep -Eq 'require|module\.exports|function doGet\(|function doPost\(' dist/apps-script/Code.gs
          grep -q 'function reclaimGetMyOrganizationSummary(' dist/apps-script/Code.gs
          grep -q 'function reclaimSetOrganizationServiceEnabled(' dist/apps-script/Code.gs
      - name: Validate Stage 4 templates and links
        run: python scripts/validate_stage4.py
